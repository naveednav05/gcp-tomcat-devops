# UAT environment values. Starts with the same image as PROD for baseline validation.
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/gcp-gke-12345/application/myapp
  tag: hf-0010
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: ""
  path: /myapp
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

forceRedeploy: 0
